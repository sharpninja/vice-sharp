# ------------------------------------------------------------------------------
# Hand-maintained (AutoGenerate = false on DefaultPoolAzurePipelines "release").
# Source: GitHub sharpninja/vice-sharp (ADO pipeline definition repo type: GitHub).
# Trigger: v* tags on GitHub (not Azure Repos).
# ------------------------------------------------------------------------------

trigger:
  tags:
    include:
      - v*

stages:
  - stage: default_pool
    displayName: 'Default agent pool'
    dependsOn: [  ]
    pool:
      name: 'Default'
    jobs:
      - job: PublishNuget
        displayName: 'PublishNuget'
        dependsOn: [  ]
        steps:
          - checkout: self
            fetchDepth: 0
          - task: CmdLine@2
            displayName: 'Run: PublishNuget'
            inputs:
              script: './build.cmd PublishNuget --skip'
      - job: PublishGitHubRelease
        displayName: 'PublishGitHubRelease'
        dependsOn: [  ]
        steps:
          - checkout: self
            fetchDepth: 0
          - task: CmdLine@2
            displayName: 'Run: PublishGitHubRelease'
            inputs:
              script: './build.cmd PublishGitHubRelease --skip'
      - job: PublishWinget
        displayName: 'PublishWinget'
        dependsOn: [ PublishGitHubRelease ]
        steps:
          - checkout: self
            fetchDepth: 0
          - task: CmdLine@2
            displayName: 'Run: PublishWinget'
            inputs:
              script: './build.cmd PublishWinget --skip'
      - job: PublishChocolatey
        displayName: 'PublishChocolatey'
        dependsOn: [ PublishGitHubRelease ]
        steps:
          - checkout: self
            fetchDepth: 0
          - task: CmdLine@2
            displayName: 'Run: PublishChocolatey'
            inputs:
              script: './build.cmd PublishChocolatey --skip'
      - job: PublishScoop
        displayName: 'PublishScoop'
        dependsOn: [ PublishGitHubRelease ]
        steps:
          - checkout: self
            fetchDepth: 0
          - task: CmdLine@2
            displayName: 'Run: PublishScoop'
            inputs:
              script: './build.cmd PublishScoop --skip'

      # FEAT-XOCTOPUS-001: optional Octopus release after package publish jobs.
      # Pipeline is fed by GitHub tags (v*). No-ops without OCTOPUS_API_KEY.
      - job: OctopusLegion2
        displayName: 'Octopus LEGION2 release'
        dependsOn:
          - PublishNuget
          - PublishWinget
          - PublishChocolatey
          - PublishScoop
        condition: and(succeeded(), ne(variables['SkipOctopus'], 'true'))
        steps:
          - checkout: self
            fetchDepth: 0
          - pwsh: |
              if (-not $env:OCTOPUS_API_KEY) {
                Write-Host 'OCTOPUS_API_KEY not set; skipping Octopus LEGION2 release'
                exit 0
              }
              $url = if ($env:OCTOPUS_URL) { $env:OCTOPUS_URL.TrimEnd('/') } else { 'http://PAYTON-LEGION2:8066' }
              if (-not (Test-NetConnection -ComputerName ([uri]$url).Host -Port ([uri]$url).Port -InformationLevel Quiet -WarningAction SilentlyContinue -ErrorAction SilentlyContinue)) {
                $url = 'http://payton-desktop:8065'
              }
              $env:OCTOPUS_URL = $url
              $env:OCTOPUS_SPACE = if ($env:OCTOPUS_SPACE) { $env:OCTOPUS_SPACE } else { 'Default' }
              $project = 'vice-sharp'
              # Prefer the GitHub tag (v1.2.1) as the Octopus release version.
              $sourceBranch = '$(Build.SourceBranch)'
              $version = if ($sourceBranch -match 'refs/tags/v?(.+)$') { $Matches[1] } else {
                ('$(Build.BuildNumber)' -replace '[^0-9A-Za-z\.\-_+]', '-')
              }
              if ([string]::IsNullOrWhiteSpace($version)) { $version = '0.0.$(Build.BuildId)' }
              $octo = 'C:\Program Files\Octopus CLI\octopus.exe'
              if (-not (Test-Path $octo)) { throw "octopus CLI missing: $octo" }
              $sha = '$(Build.SourceVersion)'
              Write-Host "Octopus $url project=$project version=$version (GitHub tag $sourceBranch @ $sha)"
              & $octo release create --project $project --version $version --packageVersion $version --releaseNotes "GitHub $sourceBranch $sha" --ignoreExisting --no-prompt
              if ($LASTEXITCODE -ne 0) { throw "octopus release create failed exit $LASTEXITCODE" }
              & $octo release deploy --project $project --version $version --deployTo Development --progress --no-prompt
              if ($LASTEXITCODE -ne 0) { Write-Warning "octopus deploy Development exit $LASTEXITCODE (release still created)" }
            displayName: Octopus LEGION2 release
            env:
              OCTOPUS_API_KEY: $(OCTOPUS_API_KEY)
              OCTOPUS_URL: $(OCTOPUS_URL)
              OCTOPUS_SPACE: $(OCTOPUS_SPACE)
