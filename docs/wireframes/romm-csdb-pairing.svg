<svg width="100%" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg">
<title>CSDb discovery and device pairing wireframe</title>
<desc>CSDb discovery list and RomM device pairing.</desc>
<style>
:root{--fg:#1a1a1a;--muted:#6a6a6a;--line:#8a8a8a;--blue:#2f6fed;--amber:#d08700;}
@media (prefers-color-scheme:dark){:root{--fg:#f0f0f0;--muted:#9aa0a6;--line:#5a5f66;--blue:#5b8cff;--amber:#e0a200;}}
svg{font-family:'Segoe UI',system-ui,sans-serif;}
.c-gray rect,.c-gray circle{fill:none;stroke:var(--line);}
.c-blue rect,.c-blue circle{fill:none;stroke:var(--blue);}
.c-amber rect,.c-amber circle{fill:none;stroke:var(--amber);}
text{fill:var(--fg);}
.t{font-size:13px;fill:var(--fg);}
.ts{font-size:11px;fill:var(--muted);}
.th{font-size:18px;font-weight:600;fill:var(--fg);}
</style>
<g class="c-gray"><rect x="6" y="6" width="668" height="250" rx="12" stroke-width="0.5"/></g>
<text class="th" x="24" y="34">CSDb discovery</text>
<g class="c-gray"><rect x="24" y="48" width="300" height="30" rx="8" stroke-width="0.5"/></g>
<text class="ts" x="34" y="68">Search scene releases...</text>
<g class="c-blue"><rect x="336" y="48" width="52" height="30" rx="8" stroke-width="0.5"/></g>
<text class="t" x="362" y="68" text-anchor="middle">Demo</text>
<g class="c-gray"><rect x="394" y="48" width="56" height="30" rx="8" stroke-width="0.5"/></g>
<text class="t" x="422" y="68" text-anchor="middle">Crack</text>
<g class="c-gray"><rect x="456" y="48" width="44" height="30" rx="8" stroke-width="0.5"/></g>
<text class="t" x="478" y="68" text-anchor="middle">SID</text>
<text class="ts" x="54" y="102">Title</text>
<text class="ts" x="380" y="102">Type</text>
<text class="ts" x="500" y="102">Source</text>
<g class="c-blue"><rect x="28" y="112" width="14" height="14" rx="4" stroke-width="0.5"/></g>
<text class="t" x="54" y="124">Comic Bakery</text>
<text class="ts" x="380" y="124">SID</text>
<text class="ts" x="500" y="124">csdb</text>
<g class="c-blue"><rect x="28" y="140" width="14" height="14" rx="4" stroke-width="0.5"/></g>
<text class="t" x="54" y="152">Cybernoid</text>
<text class="ts" x="380" y="152">crack</text>
<text class="ts" x="500" y="152">live</text>
<g class="c-gray"><rect x="28" y="168" width="14" height="14" rx="4" stroke-width="0.5"/></g>
<text class="t" x="54" y="180">Deus Ex Machina</text>
<text class="ts" x="380" y="180">demo</text>
<text class="ts" x="500" y="180">index</text>
<g class="c-blue"><rect x="28" y="196" width="14" height="14" rx="4" stroke-width="0.5"/></g>
<text class="t" x="54" y="208">Monty on the Run</text>
<text class="ts" x="380" y="208">SID</text>
<text class="ts" x="500" y="208">csdb</text>
<text class="ts" x="30" y="240">3 selected (max 20)</text>
<g class="c-blue"><rect x="518" y="222" width="132" height="30" rx="8" stroke-width="2"/></g>
<text class="t" x="584" y="242" text-anchor="middle">Ingest and scan</text>
<g class="c-gray"><rect x="6" y="276" width="668" height="216" rx="12" stroke-width="0.5"/></g>
<text class="th" x="24" y="306">RomM library - pair this device</text>
<text class="ts" x="24" y="340">Server</text>
<g class="c-gray"><rect x="90" y="324" width="300" height="28" rx="8" stroke-width="0.5"/></g>
<text class="ts" x="100" y="342">http://romm.local:8080</text>
<g class="c-blue"><rect x="24" y="366" width="366" height="66" rx="12" stroke-width="0.5"/></g>
<text class="t" x="44" y="398">Enter code   7Q4 - 2FX</text>
<text class="ts" x="44" y="416">at romm.local/pair on any signed-in device</text>
<text class="ts" x="414" y="392">Waiting for approval...</text>
<g class="c-amber"><circle cx="420" cy="406" r="5" stroke-width="0.5"/></g>
<text class="ts" x="434" y="410">device not yet linked</text>
<text class="ts" x="24" y="456">Token is stored in the console keystore. No password is typed here.</text>
<text class="ts" x="24" y="480">(A) Refresh code       (B) Back</text>
</svg>
