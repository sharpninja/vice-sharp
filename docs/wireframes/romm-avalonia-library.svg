<g class="c-gray"><rect x="492" y="330" width="168" height="28" rx="8" stroke-width="0.5"/></g>
<text class="ts" x="576" y="348" text-anchor="middle">Add to list v</text>
<g class="c-gray"><rect x="6" y="434" width="668" height="22" rx="6" stroke-width="0.5"/></g>
<text class="ts" x="18" y="449">Connected  romm.local · C64 · 3,412 titles · Drive 8 empty · Cartridge empty</text>
