<text class="ts" x="492" y="228">170 KB · 1 file</text>
<text class="ts" x="492" y="244">rating 4.6 / 5</text>
<g class="c-blue"><rect x="492" y="256" width="168" height="30" rx="8" stroke-width="0.5"/></g>
<text class="t" x="576" y="276" text-anchor="middle">Attach + play</text>
<g class="c-gray"><rect x="492" y="294" width="168" height="28" rx="8" stroke-width="0.5"/></g>
