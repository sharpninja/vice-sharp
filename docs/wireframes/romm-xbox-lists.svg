<svg width="100%" viewBox="0 0 680 462" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Xbox list management wireframe</title>
<desc>Ten-foot list management: user collections on the left, games in the selected list on the right, gamepad actions to create, rename, delete and remove.</desc>
<style>
:root{--fg:#1a1a1a;--muted:#6a6a6a;--line:#8a8a8a;--blue:#2f6fed;--amber:#d08700;}
@media (prefers-color-scheme:dark){:root{--fg:#f0f0f0;--muted:#9aa0a6;--line:#5a5f66;--blue:#5b8cff;--amber:#e0a200;}}
svg{font-family:'Segoe UI',system-ui,sans-serif;}
.c-gray rect,.c-gray circle{fill:none;stroke:var(--line);}
.c-blue rect,.c-blue circle{fill:none;stroke:var(--blue);}
.c-amber rect,.c-amber circle{fill:none;stroke:var(--amber);}
text{fill:var(--fg);}
.t{font-size:13px;fill:var(--fg);}
.ts{font-size:11px;fill:var(--muted);}
.th{font-size:18px;font-weight:600;fill:var(--fg);}
</style>
<g class="c-gray"><rect x="6" y="6" width="668" height="450" rx="12" stroke-width="0.5"/></g>
<text class="th" x="24" y="40">Lists</text>
<g class="c-gray"><rect x="24" y="60" width="200" height="336" rx="8" stroke-width="0.5"/></g>
<g class="c-blue"><rect x="32" y="70" width="184" height="28" rx="6" stroke-width="2"/></g>
<text class="t" x="44" y="89">Favorites  (12)</text>
<text class="ts" x="44" y="124">Shmups  (34)</text>
<text class="ts" x="44" y="152">Cracktros  (8)</text>
<text class="ts" x="44" y="180">SID favourites  (57)</text>
<text class="ts" x="44" y="382">+ New list</text>
<text class="t" x="244" y="80">Favorites</text>
<text class="ts" x="586" y="80">12 games</text>
<g class="c-blue"><rect x="244" y="92" width="412" height="30" rx="6" stroke-width="2"/></g>
<text class="ts" x="256" y="111">Boulder Dash · .d64</text>
<g class="c-gray"><rect x="244" y="128" width="412" height="30" rx="6" stroke-width="0.5"/></g>
<text class="ts" x="256" y="147">Paradroid · .d64</text>
<g class="c-gray"><rect x="244" y="164" width="412" height="30" rx="6" stroke-width="0.5"/></g>
<text class="ts" x="256" y="183">Uridium · .d64</text>
<g class="c-gray"><rect x="244" y="200" width="412" height="30" rx="6" stroke-width="0.5"/></g>
<text class="ts" x="256" y="219">Wizball · .crt</text>
<g class="c-gray"><rect x="244" y="236" width="412" height="30" rx="6" stroke-width="0.5"/></g>
<text class="ts" x="256" y="255">Turrican · .d64</text>
<g class="c-gray"><rect x="244" y="272" width="412" height="30" rx="6" stroke-width="0.5"/></g>
<text class="ts" x="256" y="291">Armalyte · .d64</text>
<text class="ts" x="24" y="436">(A) Open   (X) Remove from list   (Y) Rename list   (Menu) Delete list   (B) Back</text>
</svg>
