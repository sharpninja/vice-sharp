t requires own BA-derived AEC from the first offset, including a first stolen cycle, and rejects reused history, dropped prefixes and warm-up trimming. Existing bus-adapter/obs-emitter state is process-local.\",\n      \"rationale\": \"VSF does not serialize wrapper-local history; equality must be demonstrated, not synthesized by trimming until output agrees.\",\n      \"correction\": \"Keep first-stolen-cycle, stale-history and marker-boundary controls; fail on a real discrepancy.\",\n      \"round6Status\": \"PASS\"\n    },\n    {\n      \"id\": \"N11\",\n      \"status\": \"PASS\",\n      \"severity\": \"high\",\n      \"file\": \"docs/plans/PLAN-NATIVERESTORE-001.md\",\n      \"line\": 81,\n      \"section\": \"Detector initialization, failure and inertness\",\n      \"evidence\": \"D2 covers combined resolver plus xvic availability/create paths, xvic-first/x64-first fresh processes, aliases/fallbacks and failed loads. Audit environment is set before discovery; missing/unwritable logs fail loudly, separate positive logs do not contaminate the real gate.\",\n      \"rationale\": \"Availability/path probing is not itself a successful DLL load. The detector must expose specified attempts while staying out of warmed cycle paths.\",\n      \"correction\": \"Keep all failure/fallback controls and explicit no-log behavior when unset.\",\n      \"round6Status\": \"PASS\"\n    },\n    {\n      \"id\": \"N12\",\n      \"status\": \"PASS\",\n      \"severity\": \"high\",\n      \"file\": \"docs/plans/PLAN-NATIVERESTORE-001.md\",\n      \"line\": 63,\n      \"section\": \"Authorized R15 real-input amendment\",\n      \"evidence\": \"All three VSFs were parsed: two identical real MAINCPU 1.2 files and one real 1.4 file, no real 1.3. R15 verbatim changes real AC1 inputs to 1.2/1.4; D1 owns wrapper update/readback and D5 real resume/native-written 1.4 round-trip.\",\n      \"rationale\": \"This is an explicit semantic amendment, not synthetic 1.3 presented as external provenance. Synthetic 1.3 byte coverage remains required. N26 addresses propagation cleanup without reducing this obligation.\",\n      \"correction\": \"Read back exact amended AC1, unchanged normalization coverage and reference-only AC2 before acceptance.\",\n      \"round6Status\": \"PASS\"\n    },\n    {\n      \"id\": \"N13\",\n      \"status\": \"PASS\",\n      \"severity\": \"medium\",\n      \"file\": \"docs/plans/PLAN-NATIVERESTORE-001.md\",\n      \""}'
