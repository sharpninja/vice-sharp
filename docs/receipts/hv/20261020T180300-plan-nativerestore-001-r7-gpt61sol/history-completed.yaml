evidence under receipts, return nonzero with blocked IDs and reject stale artifact reuse. D5 owns the real cases.\",\n      \"rationale\": \"The acceptance/publication gap identified in round 6 is closed as a plan contract. N25 clarifies honest evidence when the native writer itself leaves no candidate file.\",\n      \"correction\": \"Use mock-proven publicati"}'
