    - id: FR-NATIVE-LIFECYCLE-001
      title: Bounded and isolated native oracle lifecycle
      description: >-
        Native VIC-20 sound-oracle reset preserves the live mixer timing and clocks.

        Create and step finish or fail within 5000 ms; stop finishes or fails within 2000 ms.

        Dispose is idempotent; a live worker never observes freed state. Failed stop poisons shared native-library state and all later operations fail immediately.

        Reset, destroy, snapshot read and snapshot write apply the same shutdown-failure policy.

        Normal audio, dual-VIA, reset, snapshot and dispose work repeatedly in one process for PAL and NTSC.
      status: pending
      priority: high
      area: NATIVE
      notes: Approved PLAN-GROK-COMPLETION-20260906. All criteria pending until named tests and independent hostile agreement.
      acceptanceCriteria:
      - id: ac-01
        text: Native VIC-20 sound-oracle reset preserves the live mixer timing and clocks.
        isSatisfied: false
      - id: ac-02
        text: Create and step finish or fail within 5000 ms; stop finishes or fails within 2000 ms.
        isSatisfied: false
      - id: ac-03
        text: Dispose is idempotent; a live worker never observes freed state. Failed stop poisons shared native-library state and all later operations fail immediately.
        isSatisfied: false
      - id: ac-04
        text: Reset, destroy, snapshot read and snapshot write apply the same shutdown-failure policy.
        isSatisfied: false
      - id: ac-05
        text: Normal audio, dual-VIA, reset, snapshot and dispose work repeatedly in one process for PAL and NTSC.
        isSatisfied: false
      scopeStartLayerKey: layer-1
      createdAt: 2026-09-28T20:32:06.5971973+00:00
