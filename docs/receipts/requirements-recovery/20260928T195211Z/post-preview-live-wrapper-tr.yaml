    - id: TR-HOST-PRG-001
      title: Host-owned PRG memory load over the gRPC emulator host contract
      description: PRG drop loading belongs to the emulator host, not Avalonia ViewModels. EmulatorHost.LoadProgram is the versioned RPC. The host reads the PRG (file path and/or payload), writes the payload through the session machine bus, decides BASIC-start from live TXTTAB ($2B/$2C) for the current machine and VIC-20 memory config (not a hardcoded C64 $0801), updates BASIC pointers only on that match, and queues HostKeyboardAutomation BASIC RUN (KERNAL keyboard buffer) when RUN is required. READY is scanned from KERNAL HIBASE ($0288) so VIC-20 unexpanded $1E00 and +8K $1000 work as well as C64 $0400. UI shells call IHostProtocolClient.LoadProgramAsync and must not poke Core devices.
      status: pending
      priority: medium
      area: HOST
      subarea: PRG
