    - id: TR-SID-ORACLE-002
      title: SID exact-oracle sampling method + buffered clock exports
      description: 'Two shim exports added for SID parity beyond the single-cycle oracle: vice_sid_exact_set_sampling(machine, method, sampleFreq, passFreq, filterScale) reconfigures the private reSID engine sampling method (0=FAST 1=INTERPOLATE 2=RESAMPLE 3=RESAMPLE_FASTMEM; clock_freq fixed 985248.0 PAL) so the 8580 SAMPLE_FAST write pipeline is observable; vice_sid_exact_clock_buffered(machine, cycles, buffer, len, out remaining) drives reSID SID::clock(delta_t, buf, n) for the S13 fixed-point resampler FIR parity. Implemented as resid_shim_set_sampling / resid_shim_clock_buffered in native/vice/vice/src/sid/resid.cc, wrapped in native/vice-shim.c under g_state_lock + is_active_machine, declared in vice-shim.h, bound via ViceNative LibraryImport + ViceNativeBridge. 8580 lockstep uses the c64c machine selector (SidModel 1 = MOS8580). reSID filter dither is zeroed in the shim for bit-exact comparability. Build: resid.o archives into src/sid/libsid.a; delete both before rebuilding. Landed by commit 93aef16 (dll SHA256 b743c666).'
      status: completed
      priority: high
      area: SID
      subarea: ORACLE
      notes: 'Both shim exports now consumed. vice_sid_exact_set_sampling: S11b FR-SID-8580 AC-06 (SAMPLE_FAST write pipeline) + S12/S13 sampling-method reconfig. vice_sid_exact_clock_buffered: S13 FR-SID-OUTPUT AC-08..13 buffered resampler lockstep (smoked green: 183 samples/4096 cycles, remainder 0). Landed by commit 93aef16 (S11a).'
      acceptanceCriteria: []
      scopeStartLayerKey: layer-1
