    text: These added criteria cover only FR-PRF-003/ac-02 and ac-04. Other obligations under this TEST condition, including FR-PRF-001, FR-PRF-002 and FR-PRF-004 through FR-PRF-008, are not covered by these criteria and remain unsatisfied until their own required evidence is accepted. Validate assertions first against independent correct mocks and deliberately corrupt mock responses rejected inside a green harness; then bind the same inputs, expected results and assertions to real managed and immutable native providers. Unknown native observations block real acceptance. Retain input, seed/history, source/binary/ROM/resource hashes and full receipts. For FR-PRF-003/ac-04, Sx64_InputCapacitors_DeadlineSelection uses clock10 with independently scripted inclusive jitter endpoints 0 and300000 to produce deadlines1500010 and1800010 for bits3/4/5. DATA writes while output, including same-value and zero writes, and DDR output-to-input transitions capture data and consume independent draws. Other DDR transitions or DATA writes while input do not. Cross-check C64_Capacitor_RngConsumptionOrder and ResetAndClockWrap assertions for SX bit order, sparse masks, uint64 wrap and prior global RNG history; reject one shared draw, exclusive endpoints, wrong1500000-cycle base, omitted repeated writes and invented native endpoint seeds.
