records:
- kind: fr
  id: FR-RUNTIME-TAPE-002
  acceptanceCriteria:
  - id: ac-01
    text: From known STOP, cover STOP, START, FORWARD, REWIND and RECORD with absent, read-only and writable images. Match accepted mode and sense. Absent-image and read-only-image RECORD do not change mode or sense; accepted writable RECORD asserts sense when the datasette is enabled.
    isSatisfied: false
  - id: ac-02
    text: Match C64 CPU port $0001 input bit 4 and VIC-20 VIA1 port A input bit 6, including DDR/output masking. Separately match C64 CIA1 FLAG and VIC-20 VIA2 CA1 pulse routing; sense is not an interrupt pulse.
    isSatisfied: false
  - id: ac-03
    text: 'A stopped motor with no pending alarm schedules the ordinary startup callback at current clock plus 32000; retain an existing alarm as VICE does. FORWARD/REWIND commands schedule their 1000-cycle alarm independently of motor-running state, including motor-on before and after that alarm dispatch. Compare ordered scheduled and actual events, not a pulse-duration getter. Also cover START while the motor is already running, with absent, read-only and writable media, with no pending alarm and with an existing pending alarm. The command reaches the start helper after resetting the gap: install t+32000 only when no alarm is pending, otherwise preserve the existing alarm; match attached-image seek, current-clock write-clock seeding and write-bit zeroing, including clock zero. Contrast START with running-motor FORWARD/REWIND, whose earlier t+1000 alarm survives the helper, and preserve any stop deadline that the command does not clear.'
    isSatisfied: false
  - id: ac-04
    text: Motor-off on a running motor sets a stop deadline of current clock plus 32000 without immediate stopping or replacing an already pending alarm. Actual stopping occurs when a datasette callback observes the deadline reached. Cover callbacks before, at and beyond the deadline, active read rescheduling, STOP with a retained later alarm, repeated off preserving the deadline, and motor-on cancellation even after the deadline but before stop execution. A stopped motor starts again through the native pending-alarm rule. Explicitly include motor-on before the stop deadline and at the deadline before callback dispatch, preserving the already-running motor, pending alarm and write state while clearing the stop deadline; neither case starts a new ramp.
    isSatisfied: false
  - id: ac-05
    text: Recording eligibility follows attached image, accepted RECORD mode, the native running-motor flag and qualifying zero-to-nonzero write-line transition. The running flag is set immediately on motor-on and retained until the delayed-stop callback. Cover writes during startup and pending stop, no writes after executed stop, rejected RECORD, repeated/opposite edges, and retained write-line updates even while ineligible.
    isSatisfied: false
  - id: ac-06
    text: Match emitted TAP bytes, last-write clock/line, remainder, image position/size/dirty state, counters and failure/STOP effects for RECORD-before-motor and motor-before-RECORD, same/future-clock first edges, short gaps 0/6/7/8/2046/2047, long gaps at and above 24-bit boundaries, TAP v0/v1/v2 output paths, and first/partial/failed writes. Preserve the native first-gap and truncation behavior. Include the pinned stream-cursor versus logical-position command-order and buffer-boundary contract in FR-TAP-004 ac-04; retained buffered-read state is part of the initial condition.
    isSatisfied: false
  - id: ac-07
    text: 'Match machine motor/write outputs: C64 DDR-masked bit-5 active-low motor and bit-3 write; VIC-20 changed PCR raw bit-1 motor and effective VIA2 PB3 write including DDRB-induced edges. Cover SX-64 disconnection, repeated writes and input/output direction changes without substituting intended hardware behavior for pinned code.'
    isSatisfied: false
  - id: ac-08
    text: 'Match enabled/disabled datasette sense/flux forwarding, tapeport device dispatch, attach/detach, resource-controlled CPU reset and retained state. Assert internal state separately from UI motor display. Preserve pending alarms, gap state and sense exactly as pinned VICE, including no universal tapeport-active suppression of every signal. Enumerate attachment with a new STOP-mode image while an old read alarm is pending; internal reset selects the new image mode, so do not automatically remove that alarm. Enumerate reset/attachment during delayed stop: motor_stop_clk clears while the native motor-running flag is retained, independently of UI motor-off display. Enumerate detach and no-image reset with previously retained START/FORWARD/REWIND notape_mode, including helper calls, scheduled alarms and transient sense before attachment clears it. Compare ordered transitions, not only final values. Pin DatasetteResetWithCPU, autostart reset handling and event-playback/network routing; exercise their alternate paths rather than assume every public control request reaches the internal command handler.'
    isSatisfied: false
  description: Datasette transport, tape sense, motor scheduling, machine wiring and recording shall reproduce pinned immutable VICE for identical machine, board, resource, media, control and clock state. Preserve separate motor input, native running state, scheduled alarm time and actual callback time. Machine wiring belongs in machine adapters. Native quirks are target behavior; managed pulse-buffer success is not parity.
- kind: tr
  id: TR-TAP-EDGE-001
  acceptanceCriteria:
  - id: ac-01
    text: Apply FR-RUNTIME-TAPE-002 ac-01 media/control matrix to accepted transport state and sense. Ignored RECORD is not a RecordPressed success. Include enabled-state gating and unchanged observations.
    isSatisfied: false
  - id: ac-02
    text: Apply FR-RUNTIME-TAPE-002 ac-02 and ac-07 to separate machine sense inputs, read-pulse interrupt inputs and motor/write outputs, including direction registers, raw VIC-20 PCR behavior and SX-64.
    isSatisfied: false
  - id: ac-03
    text: Apply FR-RUNTIME-TAPE-002 ac-05 to ordered recording eligibility and write edges; assert output absence as well as writes and retained line state. Native running state is distinct from control input and completed startup delay.
    isSatisfied: false
  - id: ac-04
    text: Apply FR-RUNTIME-TAPE-002 ac-06 to exact recording bytes and side effects, including both RECORD/motor orderings, first-edge clock handling, 24-bit truncation and failed/partial writes.
    isSatisfied: false
  - id: ac-05
    text: Retain legacy TAP v0/v1/v2 decoding, long-pulse, header and clock-selection coverage. v0 zero consumes no extension. The file/block decoder uses its native pulse units and v2 halfwave combination; the live datasette path uses its own zero-gap resources, direction, machine-specific halfwave handling, wobble and azimuth state. Cover truncated extensions and warning-versus-rejection outcomes without merging these paths. Include all version-byte values and independent physical/declared-size cases from FR-TAP-002 ac-04/ac-08. Use the explicit hidden-state/resource fixture contract in TEST-TAP-001 ac-06; an ordinary reset is not a fresh process.
    isSatisfied: false
  - id: ac-06
    text: Retain legacy CBM and TurboTape pilot/header detection with boundary fixtures against pinned tap.c. C64 and VIC-20 configured CBM pulse-unit ranges are inclusive 36-54, 55-73 and 74-100 after tap_init; TurboTape uses its own ranges and pilot/header control flow. Test each endpoint, adjacent outside value, missing/truncated pilot/header and malformed stream; do not replace loader behavior with a count of parsed pulses.
    isSatisfied: false
  description: 'This existing ID retains both historical obligations: TAP version/long-pulse/clock/CBM/TurboTape decoding and datasette transport/sense/recording. Keep the file/block decoder distinct from the clocked datasette read path. Use one reconciled canonical contract; do not retire either meaning or remove its FR/TEST mappings.'
  title: TAP decoding, datasette sense and recording edge parity
- kind: tr
  id: TR-TAPE-EDGE-001
  acceptanceCriteria:
  - id: ac-01
    text: 'Assert stopped-motor ordinary startup at t+32000 with no pending alarm and preservation of an existing pending alarm. Observe callback dispatch separately from scheduled time; no first-Tick bypass. Exercise the separate command-entry path: START on an already-running motor invokes the start helper with and without media, schedules t+32000 only without a pending alarm, and preserves a pending alarm while still performing the native seek and write-state initialization. Distinguish command START from motor-line re-enable, and preserve the t+1000 alarm already installed by FORWARD/REWIND before their helper call.'
    isSatisfied: false
  - id: ac-02
    text: Assert motor-off sets t+32000 stop deadline, retains a pending alarm and running state until a callback executes at or after that deadline, and repeated motor-off does not extend it. Include no-pending exact-deadline stop, retained late read/STOP alarms and a before-deadline callback rescheduling beyond the deadline.
    isSatisfied: false
  - id: ac-03
    text: Assert motor-on cancels a stop not yet executed, including after the nominal deadline but before a late callback, without imposing a new startup delay on an already-running motor. After an executed stop, obey the ordinary start helper and its pending-alarm preservation. Include cancellation before the deadline and same-clock cancellation before callback dispatch as separate cases from cancellation after the deadline; for an already-running motor, preserve the existing alarm and write state and clear only the stop deadline in this path.
    isSatisfied: false
  - id: ac-04
    text: Compare complete ordered control, alarm, running-state and pulse traces at deadline-1/deadline/deadline+1 and at actual callback boundaries. Pin same-clock ordering, callback offset, tape resources and effective gap; reject missing, extra, duplicate, reordered or synthesized events.
    isSatisfied: false
  - id: ac-05
    text: FORWARD and REWIND schedule a 1000-cycle alarm after the mode assignment, with absent or attached media and motor on or off. Cover replacement of a pending read alarm and motor-on before/after the fast callback; preserve the executed native behavior rather than the helper comment intent.
    isSatisfied: false
  - id: ac-06
    text: Retain legacy sense-dongle and CP Clock F83 semantics. Dongle enable and power-up assert sense, while its disable callback does not itself clear sense. RTC motor input drives inverted SDA, write input drives normalized SCL, and sense is asserted only when RTC data is high and motor-state is false. Cover repeated calls, all truth-table inputs and selected-device lifecycle without synthesizing datasette PLAY.
    isSatisfied: false
  - id: ac-07
    text: Apply FR-RUNTIME-TAPE-002 ac-08 to per-call-site device enable gating, tapeport dispatch, attachment and reset. Assert internal motor state independently of the UI reset indication and pin reset resources. The lifecycle matrix must include every retained-mode, pending-alarm, cancelled-stop/running-state and dispatch-routing case explicitly listed by FR-RUNTIME-TAPE-002 ac-08, including transient intermediate observations.
    isSatisfied: false
  description: 'This existing ID retains both historical obligations: datasette startup/delayed-stop/fast-wind timing and tapeport sense/motor/RTC/dongle semantics. Model scheduling in the emulated clock domain and preserve the selected native device behavior. A datasette is not the only possible source of tape sense.'
  title: Datasette timing and tapeport peripheral line parity
- kind: test
  id: TEST-TAPE-RAMP-001
  acceptanceCriteria:
  - id: ac-01
    text: Startup_NoPendingAlarm_DeadlineBoundaries and Startup_PendingAlarm_NotOverwritten assert ordered schedules, callback times and events; incorrect early/late/missing/duplicated/reordered events are rejected within a passing mock harness. Start_CommandWhileMotorRunning_NoPendingAlarm and Start_CommandWhileMotorRunning_PendingAlarm cover absent/read-only/writable media, clock zero/nonzero, seek/no-seek, retained write state and a pending stop deadline; reject omission of the command helper path, wrong alarm replacement or absence, wrong seek, wrong write-clock/bit seeding, and clearing a stop deadline that START leaves intact.
    isSatisfied: false
  - id: ac-02
    text: Run all named delayed-stop and cancellation cases in the amendment ledger, retaining deadline and callback boundaries separately. Reject immediate stop, guaranteed-deadline stop despite an existing late alarm, repeated-off deadline extension and unconditional off/on restart. MotorOn_CancelsPendingStop covers deadline-1 and the exact deadline with motor-on ordered before callback dispatch; assert stop-clock clearing, unchanged running/alarm/write state and no startup ramp, and reject wrong mocks that restart only in these earlier cancellation cases.
    isSatisfied: false
  - id: ac-03
    text: Real-provider validation reuses every mock input/assertion and obtains actual native and managed ordered observations. Source inspection, an analytical trace or a duration getter cannot substitute for actual pulse/state evidence. Missing capability fails closed.
    isSatisfied: false
  - id: ac-04
    text: Run every case without skips in full applicable cumulative native-safe and real-emulator suites after native-safe integration. Retain exact commands, counts, TRX/logs, identities, failure history and accepted hostile review before satisfaction.
    isSatisfied: false
  - id: ac-05
    text: Run each named fast-wind case for both FORWARD and REWIND, attached/absent media and stopped/running motor. Assert 1000-cycle command alarms, preservation by motor-on when pending and 32000 startup only when the ordinary helper has no pending alarm; reject unconditional startup timing.
    isSatisfied: false
  description: Validate FR-RUNTIME-TAPE-002 ac-03/ac-04 and TR-TAPE-EDGE-001 ac-01 through ac-05 using shared clock/control/alarm cases. Green correct-mock and expected negative-control evidence precedes production changes. Reuse the same cases and assertions with real managed/native observations; no fixed historical passing total is an acceptance condition.
  title: Datasette startup, delayed-stop and fast-wind parity
- kind: test
  id: TEST-TAPE-SENSE-001
  acceptanceCriteria:
  - id: ac-01
    text: TransportSense_MediaCommandMatrix covers five commands from STOP, absent/read-only/writable images, enabled-state sense gating and later STOP. Reject wrong polarity, ignored-command state changes and missing transitions.
    isSatisfied: false
  - id: ac-02
    text: MachineSense_C64CpuPortAndVic20Via1 covers both machines and DDR/output masking; TapeRead_PulseInterruptRouting separately covers CIA1 FLAG and VIA2 CA1. Reject wrong port/bit/direction/interrupt target and extra or missing pulse events.
    isSatisfied: false
  - id: ac-03
    text: Run all recording eligibility/window/edge cases in the ledger, including startup, pending stop, after nominal deadline before callback and after executed stop. Assert writes/no-writes and retained line state. Reject no-image recording and invented startup inhibits.
    isSatisfied: false
  - id: ac-04
    text: Run both RECORD/motor orderings and gap/error cases including 0/6/7/8/2046/2047, remainder carry, same/future-clock edges, v0/v1/v2, 0xffffff/0x1000000/0x1000001 and zero/one/two/three-byte long-payload writes. Assert bytes, image position/size/dirty state, counters, retained state and STOP side effects against independent native expectations.
    isSatisfied: false
  - id: ac-05
    text: Reuse all fixtures/assertions with actual immutable native and managed providers, then run full cumulative suites. Missing, failed, skipped, aborted or mock-only cases cannot satisfy AC; require independent AGREE, both scores at least 98 and zero FAIL/UNKNOWN.
    isSatisfied: false
  - id: ac-06
    text: Run machine motor/write cases for C64 bit 5/bit 3, input/output DDR and DDR-only changes, VIC-20 PCR raw-byte motor and VIA2 PB3/DDRB transitions, repeated writes and SX-64. Wrong bit, normalized-but-nonnative PCR behavior, omitted DDR edge and connected SX-64 mocks must be rejected.
    isSatisfied: false
  - id: ac-07
    text: Run datasette and tapeport enable/dispatch/attach/detach/reset cases with each reset-resource branch. Reject UI-only internal-state assertions, synthesized motor clears and universal tapeport-active suppression.
    isSatisfied: false
  - id: ac-08
    text: Run sense-dongle lifecycle and CP Clock F83 truth-table cases. Reject datasette-only sense, forced deassertion by the dongle disable callback, wrong SDA inversion, wrong SCL normalization and incorrect RTC sense combinations.
    isSatisfied: false
  description: Validate FR-RUNTIME-TAPE-002 ac-01/ac-02/ac-05 through ac-08 and the corresponding TR-TAP-EDGE-001 and TR-TAPE-EDGE-001 criteria. Establish independent correct and discriminating wrong mocks, then bind unchanged inputs/assertions to real providers. Preserve historical evidence without treating old counts or wrong expectations as acceptance.
  title: Datasette transport, machine wiring, recording and lifecycle parity
- kind: fr
  id: FR-TAP-001
  acceptanceCriteria:
  - id: ac-01
    text: C64 CPU-port bit 5 controls active-low motor output as !((DDR & DATA) & 0x20); input direction drives motor-on. Bit 3 is tape write, not motor. VIC-20 and SX-64 behavior follows FR-RUNTIME-TAPE-002 ac-07.
    isSatisfied: false
  - id: ac-02
    text: 'Use the native emulated-clock schedule: ordinary start adds 32000 only if no alarm is pending; FORWARD/REWIND uses its 1000-cycle command alarm. Do not substitute an approximate real-hardware half-second timer.'
    isSatisfied: false
  - id: ac-03
    text: Tape motion, read-pulse delivery and stopping match the ordered native transport/alarm trace, including late stop execution and pending-alarm cases. Do not conflate immediate native running-state assertion with first movement or apply a universal spin-up-complete gate to every operation.
    isSatisfied: false
  - id: ac-04
    text: PLAY/sense is not a prerequisite for asserting the native motor-running flag. Cover motor-on in STOP and RECORD, and distinguish transport mode/sense from motor control and running state.
    isSatisfied: false
  - id: ac-05
    text: Motor state changes are reflected in the `ITapeUnit.MotorState` property.
    isSatisfied: false
  - id: ac-06
    text: Tape audio remains required. With identical sound-enabled/volume/sample-format/rate and tape halfwave/gap inputs, match pinned VICE datasette sound buffer and output samples, including disabled flush, buffer wrap, empty output and gap boundaries. Native datasette sound-chip output, not an assumed SID EXT IN route, is the acceptance target.
    isSatisfied: false
  description: Motor input, native running state, transport motion, public state exposure and tape audio shall follow pinned immutable VICE for the selected machine and resources. C64 motor control is DDR-masked CPU-port bit 5, not bit 3. Ordinary startup scheduling and actual delayed-stop callback execution are distinct from physical-drive approximations. Preserve the existing public MotorState obligation and tape-audio functionality.
- kind: fr
  id: FR-TAP-002
  acceptanceCriteria:
  - id: ac-01
    text: 'For nonzero TAP bytes, preserve native pulse units and layer-specific conversion: file/block decoding uses pulse units while live datasette gaps use byte times eight before resource adjustments. Do not globally label every v0 byte a half-period.'
    isSatisfied: false
  - id: ac-02
    text: A v0 zero consumes only that byte. The file/block decoder returns 256 pulse units; the live datasette uses DatasetteZeroGapDelay and its adjustments. Adjacent bytes remain separate pulses, not a 24-bit extension.
    isSatisfied: false
  - id: ac-03
    text: For v1/v2 zero, cover three-byte little-endian extensions, truncated extension and all-zero length at each native layer. File/block v2 combines two halfwaves; live behavior depends on selected machine tape behavior and retains its native direction/resource effects.
    isSatisfied: false
  - id: ac-04
    text: Header handling matches native short-read/magic rejection, stored version/system/video values, mismatch warning versus error behavior, declared data handling and clock fallback. Do not reject a mismatch that the corresponding native path only warns about. Test actual payload sizes 0, 1, 2 and 3 independently of declared header length; native tap_open rejects fewer than three actual bytes, and derives size from the physical file rather than the declared length. With at least three valid payload bytes, vary declared length below/equal/above actual length without incorrectly attributing a minimum-size rejection to a length mismatch. Cover every stored version byte 0 through 255 with otherwise valid headers; header acceptance is distinct from decoder outcome.
    isSatisfied: false
  - id: ac-05
    text: Tape images can be mounted and unmounted at runtime via `ITapeUnit.Mount()`/`ITapeUnit.Eject()`.
    isSatisfied: false
  - id: ac-06
    text: Writing to TAP preserves native recording eligibility, clocks, byte encoding, first-gap and failure effects from FR-RUNTIME-TAPE-002 ac-05/ac-06, including v0/v1/v2 output behavior and 24-bit truncation.
    isSatisfied: false
  - id: ac-07
    text: Header machine tags distinguish C64, VIC-20 and C16/Plus4 and use the native machine/video clock table. Tests pin selected machine separately from the media header and preserve native mismatch/fallback behavior.
    isSatisfied: false
  - id: ac-08
    text: 'Cover mount/eject, forward/reverse gap access and truncated media without treating file metadata decoding as a live pulse trace. Both layers require independent expected observations; missing native live evidence fails closed. For versions 3 through 255, a zero byte in the block decoder yields zero pulse units without consuming an extension; nonzero bytes remain ordinary pulse units. In regular C64/VIC-20 live tape behavior, a zero for any nonzero version takes the three-byte extension branch. Cover complete/all-zero/truncated extensions, following-byte alignment and EOF, with independent consumed-byte/file-position and timing assertions. Qualify by selected machine tape behavior: C16 live handling has only version-1 and version-2 branches here, so do not generalize the regular-machine unknown-version result to it. For block version 2, include missing/partial second halfwave and retain the distinction between physical stream consumption and pos_advance.'
    isSatisfied: false
  description: Read/write TAP behavior shall match pinned VICE at the corresponding file/block decoder and live datasette layer. v0 zero does not consume a three-byte extension. v1/v2 extension, halfwave, header, clock and resource behavior must not be merged into a different invented format. Retain public mount/eject and machine-tag obligations.
  title: TAP File Format Support (v0, v1 and v2 native behavior)
- kind: fr
  id: FR-TAP-003
  acceptanceCriteria:
  - id: ac-01
    text: C64 read pulses reach CIA1 FLAG and VIC-20 read pulses reach VIA2 CA1 with the pinned native edge/state semantics. Tape sense remains a distinct input.
    isSatisfied: false
  - id: ac-02
    text: With identical pinned firmware and tape workload, timer/interrupt observations used to measure pulses match native VICE, including boundary and pending-interrupt state. A decoder return value is not timer/interrupt evidence.
    isSatisfied: false
  - id: ac-03
    text: Configured C64/VIC-20 file-decoder CBM pulse-unit ranges are inclusive 36-54 short, 55-73 middle and 74-100 long. Test endpoint and adjacent values after tap_init conversion. Keep live pulse clocks separate; do not pair inconsistent fixed cycle counts with TAP byte values.
    isSatisfied: false
  - id: ac-04
    text: Pinned standard Commodore header, data-block and checksum workloads produce the same decoded bytes/status and machine-visible load outcome as native VICE. Include malformed, truncated and checksum-error fixtures.
    isSatisfied: false
  - id: ac-05
    text: At normal speed, the same named tape workload produces the same ordered native and managed machine-visible pulse/state/output observations. Hardware assumptions or source inspection alone cannot replace the immutable native target.
    isSatisfied: false
  - id: ac-06
    text: Run PAL and NTSC selected-machine/resource profiles with separately pinned tape headers and clock domains. Preserve native differences and any lack of cross-standard rescaling; do not improve the native target.
    isSatisfied: false
  description: Tape read pulse delivery, timer/interrupt effects and data decoding shall match immutable VICE for the selected C64 or VIC-20, clock/resources, firmware and workload. File/block decoder thresholds and real machine signal timing are different observable layers; neither can substitute for the other.
- kind: fr
  id: FR-TAP-004
  acceptanceCriteria:
  - id: ac-01
    text: Capture qualifying native write-line transitions from C64 CPU-port bit 3 and VIC-20 VIA2 PB3, including DDR-only changes, repeated/opposite edges and SX-64 disconnection.
    isSatisfied: false
  - id: ac-02
    text: Store the same bytes, gap/remainder, last-write state, file position/size/dirty state and counters as pinned VICE across short/long/24-bit boundaries and partial/failed output.
    isSatisfied: false
  - id: ac-03
    text: A standard Commodore SAVE workload with pinned firmware, writable tape, resources and initial state produces the same bytes/status and machine-visible effects as immutable VICE, and its corresponding native/managed load results match. Include failure and write-protected cases.
    isSatisfied: false
  - id: ac-04
    text: New-image, existing-image current-position and explicit end-position recordings preserve the same prefix/suffix and file-position/size effects as native VICE. Existing-file writes must not silently become unconditional append or truncate. Retain RECORD accepted while the motor already runs as an in-scope sequence, including after buffered reads; that command does not itself seek. Distinguish the actual C stream cursor from logical image position and compare the bytes and both positions that pinned native execution produces. Include RECORD-before-motor, motor-before-RECORD, read-then-RECORD, intervening START/seek, beginning/interior/end positions and buffer-refill boundaries. Pin the exact native binary, platform/C runtime, file mode, initial bytes and I/O prelude, and retain repeated native observations. Do not invent a platform-independent result, insert a compensating native seek, silently exclude an ordering or treat an unstable/unobservable result as a passing gate.
    isSatisfied: false
  - id: ac-05
    text: Writable-image RECORD acceptance is the native interlock; absent/read-only-image RECORD is ignored. Do not require an additional independent PlayPressed boolean once native RECORD mode is accepted. Motor-running and qualifying-edge conditions still apply.
    isSatisfied: false
  description: Write data to tape images using the selected machine native write-line path and accepted datasette RECORD state. C64 uses CPU-port bit 3; VIC-20 uses effective VIA2 PB3. Preserve native timing, image position, existing content, first-write quirks and write failures, not an in-memory pulse-count substitute.
- kind: test
  id: TEST-TAP-001
  acceptanceCriteria:
  - id: ac-01
    text: Cover FR-TAP-001 motor control/timing and FR-RUNTIME-TAPE-002 command/sense/motor/write behavior, including pending-alarm stop, fast wind, DDR-only transitions, both RECORD/motor orders, failures and lifecycle. Reuse TEST-TAPE-RAMP-001 and TEST-TAPE-SENSE-001 cases without omitting them from cumulative gates.
    isSatisfied: false
  - id: ac-02
    text: Cover all FR-TAP-002 and TR-TAP-EDGE-001 decoder/header/clock/version scenarios, with separate block-decoder and live-datasette assertions. Reject v0 extension consumption, universal halfwave conversion, incorrect truncation, mismatch rejection and clock-domain conflation.
    isSatisfied: false
  - id: ac-03
    text: Cover FR-TAP-003 and FR-TAP-005 pulse boundaries, CBM and TurboTape pilot/header paths, standard load/checksum outcomes and every already-required named turbo format (Novaload, Biturbo, Turbotape, Cyberload, Pavloda), half/full-wave and changing-speed workloads. Pin actual fixtures and firmware; missing fixture, oracle or observation is a failure, never an invented successful loader result.
    isSatisfied: false
  - id: ac-04
    text: Cover retained public motor-state/mount/eject obligations, native tape-audio behavior and machine-visible SAVE/reload/new-existing-append results. Wrong API state, audio samples, persisted bytes, position or failure effects must be rejected by independent negative controls.
    isSatisfied: false
  - id: ac-05
    text: Cover sense dongle enable/disable/power-up and CP Clock F83 motor/SDA/write/SCL/sense cases from TR-TAPE-EDGE-001 ac-06, with device selection and no-datasette cases.
    isSatisfied: false
  - id: ac-06
    text: For every AC-mapped case, valid independent scripted mock responses pass all assertions. Deliberately wrong value, missing/extra/duplicate/reordered observation, wrong clock/side effect and failure-versus-success response must be rejected as an expected negative control within a passing native-safe suite. No failing suite or production-derived expected value qualifies. Pin fresh-process identity or the complete ordered prelude, including the attach-time full-image scan and any prior ports/devices; ordinary reset, detach or VSF reload must not be assumed to clear unrepresented process state. Record initial last-write line/clock, C64 previous-port output statics and SX-64 capacitors, VIA previous outputs, wobble phase/rounding remainder, azimuth RNG/remainder, audio ring/phase state and RTC persistent context/host-time inputs wherever observable. Timing-baseline fixtures explicitly disable wobble/tuning/azimuth; separate mandatory non-neutral fixtures exercise those resources and retained state with pinned native arithmetic/platform and RNG history. Neutral baseline success does not waive non-neutral behavior. RTC transactions pin persistent RAM/registers/offset, time source (including centiseconds), timezone and call order; halted seconds alone do not prove a deterministic RTC. If a required native input or observation cannot be fixed or captured without changing VICE, that case remains blocked, not skipped or satisfied. Native VSF remains the canonical snapshot format and its real interoperability gates remain mandatory.
    isSatisfied: false
  - id: ac-07
    text: Bind the same inputs/assertions to real managed/native providers, retain exact identities and first divergence, run full applicable current-plus-prior suites with zero failed/skipped/aborted cases, and obtain AGREE at accuracy/completeness at least 98 with zero FAIL/UNKNOWN before satisfaction. Preserve all original xvic/x64sc/VSF and later start-approval gates.
    isSatisfied: false
  description: Retain all existing datasette motor, TAP parsing, pulse timing, tape write and turbo-loader coverage, and explicitly map both historical meanings of TR-TAP-EDGE-001/TR-TAPE-EDGE-001. Unit assertions first discriminate independent correct/wrong mocks in a green suite, then remain unchanged for real managed/native providers and named workload gates.
  title: Tape format, machine I/O, peripherals, audio and loader contracts
- kind: fr
  id: FR-BACKFILL-MEDIA-001
  acceptanceCriteria:
  - id: ac-01
    text: For the same pinned D64 fixtures and operation sequence, sector reads/writes, returned semantic status, error-map effects and persisted bytes match native VICE; cover valid sectors, geometry boundaries, malformed/truncated input, read-only input, read errors and failed writes without treating success-only BAM reads as complete coverage.
    isSatisfied: false
  - id: ac-02
    text: True-drive IEC line contributions, both ATN edges, enabled/disabled drive cases, contention, drive motor/rotation progression and DOS-mediated BAM-read bytes/status/effects must match pinned native VICE for identical initial conditions; direct image access cannot satisfy true-drive acceptance. FR-ARCH-TRUEDRIVE-1541-002 is an existing live record, but its zero-AC state is not acceptance evidence. Its exact true-drive AC expansion belongs to the separate unapproved drive proposal and must receive independent HV and explicit operator approval before drive implementation or satisfaction. This tape amendment does not approve that dependency or waive these media obligations.
    isSatisfied: false
  - id: ac-03
    text: Datasette motor startup, delayed stop/cancellation, pulse delivery, sense-line wiring and recording on writable media must satisfy the existing live FR-RUNTIME-TAPE-002 contract as amended only after explicit approval of this exact packet, for C64 and VIC-20. A metadata pulse read or in-memory recording count alone is insufficient. The earlier application of FR-RUNTIME-TAPE-002 does not approve the new text in this amendment.
    isSatisfied: false
  - id: ac-04
    text: Each accepted media scenario retains fixture/firmware/resource hashes, mode, initial state, clock domain, operation sequence, ordered observations and first mismatch. Reusing a host-cycle deadline as a drive/tape clock assertion or comparing different media modes is rejected.
    isSatisfied: false
  - id: ac-05
    text: All preceding assertions first pass with independent discriminating mocks and expected negative controls, then the same inputs/assertions pass with real providers and the full applicable suites. Missing, skipped, failing or mock-only evidence leaves the criterion unsatisfied.
    isSatisfied: false
  description: 'Managed media behavior shall reproduce the pinned native VICE reference at the corresponding layer: D64 image-sector data/status/persistence, true-drive IEC and motor behavior, and machine-specific datasette timing/sense/record behavior. Image-buffer success, synthetic motor counters and historical test totals cannot substitute for real-emulator parity. Preserve the separate buffered and true-drive modes and all legacy evidence.'
  title: D64, tape and IEC media behavior matches immutable native VICE
- kind: fr
  id: FR-CPU-004
  acceptanceCriteria:
  - id: ac-01
    text: Address $0000 is the Data Direction Register (DDR); bits set to 1 configure the corresponding $0001 bit as output.
    isSatisfied: false
  - id: ac-02
    text: Address $0001 bits 0-2 (LORAM, HIRAM, CHAREN) control PLA banking and are reflected immediately in the address space configuration.
    isSatisfied: false
  - id: ac-03
    text: On C64, the cassette motor output is active low from DDR-masked bit 5, !(DDR & DATA & 0x20), and the cassette write output is bit 3, (~DDR | DATA) & 0x08. Match pinned VICE's changed-effective-output detection for data and DDR writes, including input/output transitions and repeated writes. Do not exchange the motor and write bits.
    isSatisfied: false
  - id: ac-04
    text: Bit 4 reads the cassette switch sense (active low).
    isSatisfied: false
  - id: ac-05
    text: On the C64 board, reading $0001 with DDR bit 5 clear returns bit 5 clear; with DDR bit 5 set, its output readback follows pinned VICE's port data/DDR calculation. Bit 5 is the motor-control bit, not an unused pin. Exercise both data levels, both DDR directions, and direction changes; do not substitute SX-64 floating-pin behavior for C64 behavior.
    isSatisfied: false
  - id: ac-06
    text: 'Unused CPU-port pins reproduce the pinned VICE C64/SX-64 charge and decay behavior: bits 6 and 7 on both boards use a deadline of the current CPU clock plus 350000 cycles plus an inclusive random value from 0 through 70000; SX-64 bits 3, 4 and 5 use 1500000 plus an inclusive 0 through 300000. Writing a pin while configured as output, including a repeated identical data write, or changing it from output to input captures its data bit and sets its deadline. Other DDR transitions do not reset that deadline. Reads of $0001 clear active retained charge only when the deadline is strictly less than the current CPU clock, and substitute retained charge only for pins configured as input; reads of $0000 do not perform this discharge. Preserve native board selection, random-state consumption order, unsigned 64-bit clock arithmetic and reset behavior. Do not replace the executed behavior with a fixed 350-microsecond delay, an unused 8500 constant, or host-time expiration.'
    isSatisfied: false
  - id: ac-07
    text: The `IMemoryMappedDevice` interface exposes the port to the address decoder.
    isSatisfied: false
  description: |-
    The MOS 6510 processor's built-in I/O port at addresses $0000 (data direction register) and $0001 (data port) shall be emulated. This port controls the PLA memory banking configuration (LORAM, HIRAM, CHAREN bits), the cassette motor, and the cassette sense line. The data port shall exhibit the correct behavior with pull-up/pull-down resistors and the capacitive discharge timing that affects reads of floating input pins.

    ## Acceptance Criteria
    - Address $0000 is the Data Direction Register (DDR); bits set to 1 configure the corresponding $0001 bit as output.
    - Address $0001 bits 0-2 (LORAM, HIRAM, CHAREN) control PLA banking and are reflected immediately in the address space configuration.
    - On C64, the cassette motor output is active low from DDR-masked bit 5, !(DDR & DATA & 0x20), and the cassette write output is bit 3, (~DDR | DATA) & 0x08. Match pinned VICE's changed-effective-output detection for data and DDR writes, including input/output transitions and repeated writes. Do not exchange the motor and write bits.
    - Bit 4 reads the cassette switch sense (active low).
    - On the C64 board, reading $0001 with DDR bit 5 clear returns bit 5 clear; with DDR bit 5 set, its output readback follows pinned VICE's port data/DDR calculation. Bit 5 is the motor-control bit, not an unused pin. Exercise both data levels, both DDR directions, and direction changes; do not substitute SX-64 floating-pin behavior for C64 behavior.
    - Unused CPU-port pins reproduce the pinned VICE C64/SX-64 charge and decay behavior: bits 6 and 7 on both boards use a deadline of the current CPU clock plus 350000 cycles plus an inclusive random value from 0 through 70000; SX-64 bits 3, 4 and 5 use 1500000 plus an inclusive 0 through 300000. Writing a pin while configured as output, including a repeated identical data write, or changing it from output to input captures its data bit and sets its deadline. Other DDR transitions do not reset that deadline. Reads of $0001 clear active retained charge only when the deadline is strictly less than the current CPU clock, and substitute retained charge only for pins configured as input; reads of $0000 do not perform this discharge. Preserve native board selection, random-state consumption order, unsigned 64-bit clock arithmetic and reset behavior. Do not replace the executed behavior with a fixed 350-microsecond delay, an unused 8500 constant, or host-time expiration.
    - The `IMemoryMappedDevice` interface exposes the port to the address decoder.
- kind: fr
  id: FR-PRF-003
  acceptanceCriteria:
  - id: ac-01
    text: 'KERNAL: SX-64 variant KERNAL ROM with different default colors (blue screen instead of light blue).'
    isSatisfied: false
  - id: ac-02
    text: The SX-64 board has no connected cassette port. Match pinned VICE's board-specific PLA inputs and suppress forwarding of motor, write and sense-out changes to tapeport devices. CPU-visible reads of bits 3-5 must still follow the native data, DDR and retained floating-capacitor state; neither permanently-high nor permanently-low input values are a valid universal substitute.
    isSatisfied: false
  - id: ac-03
    text: 'Built-in 1541 drive: device 8 is always present.'
    isSatisfied: false
  - id: ac-04
    text: 'For SX-64 CPU reads of $0001, each input-configured bit 3, 4 and 5 is replaced by its retained native data_set_bit value after native falloff processing. Reset clears those retained values. Output writes and output-to-input transitions seed the corresponding retained data bit, falloff flag and deadline as pinned VICE does. A flagged retained value clears on a read only when its stored deadline is strictly less than maincpu_clk: a charged input therefore remains charged at the exact deadline and clears on the first later read. Output-configured bits retain normal port readback. Match each bit independently, native RNG-dependent deadline selection, repeated writes, direction transitions, reset and read side effects; do not impose an always-high or always-zero sense bit.'
    isSatisfied: false
  - id: ac-05
    text: All other hardware is identical to the C64 NMOS profile.
    isSatisfied: false
  - id: ac-06
    text: Selectable via `IMachineProfile.LoadProfile("sx64")`.
    isSatisfied: false
  description: |-
    The SX-64 is a portable C64 with a built-in 1541 disk drive and a 5" color monitor. It lacks a cassette port and has a different KERNAL ROM (no tape routines, different screen colors on startup).

    ## Acceptance Criteria
    - KERNAL: SX-64 variant KERNAL ROM with different default colors (blue screen instead of light blue).
    - The SX-64 board has no connected cassette port. Match pinned VICE's board-specific PLA inputs and suppress forwarding of motor, write and sense-out changes to tapeport devices. CPU-visible reads of bits 3-5 must still follow the native data, DDR and retained floating-capacitor state; neither permanently-high nor permanently-low input values are a valid universal substitute.
    - Built-in 1541 drive: device 8 is always present.
    - For SX-64 CPU reads of $0001, each input-configured bit 3, 4 and 5 is replaced by its retained native data_set_bit value after native falloff processing. Reset clears those retained values. Output writes and output-to-input transitions seed the corresponding retained data bit, falloff flag and deadline as pinned VICE does. A flagged retained value clears on a read only when its stored deadline is strictly less than maincpu_clk: a charged input therefore remains charged at the exact deadline and clears on the first later read. Output-configured bits retain normal port readback. Match each bit independently, native RNG-dependent deadline selection, repeated writes, direction transitions, reset and read side effects; do not impose an always-high or always-zero sense bit.
    - All other hardware is identical to the C64 NMOS profile.
    - Selectable via `IMachineProfile.LoadProfile("sx64")`.
- kind: fr
  id: FR-TAP-005
  acceptanceCriteria:
  - id: ac-01
    text: Turbo loaders using shorter pulses than the standard Commodore format, including the existing approximately-160-cycle workload obligation, function correctly with the same pinned C64 firmware, tape fixture, resources and initial state as native VICE. Do not impose 160 cycles as a parser minimum or normalize pulse widths to hardware estimates; cover representable values below, at and above 160 with separately asserted block-decoder units and native live scheduling/interrupt traces.
    isSatisfied: false
  - id: ac-02
    text: Common turbo formats (Novaload, Biturbo, Turbotape, Cyberload, Pavloda) load successfully. For each named C64 format, retain identified fixture and firmware hashes, resources, initial state, load entry/operation sequence, expected loaded bytes and machine-visible completion/failure observations. Native and managed results must both satisfy successful loading and match; two equal failures do not satisfy this criterion. A missing fixture, oracle capability or completion observation leaves the corresponding format unsatisfied, not waived.
    isSatisfied: false
  - id: ac-03
    text: Custom pulse encoding schemes are supported through accurate pulse-level emulation. Pin custom-stream bytes and their format-specific expected loading/output behavior independently of the managed implementation; compare ordered native and managed tape/interrupt/timer observations without converting the input into a recognized standard loader or normalizing its pulse widths. Include malformed/truncated and boundary fixtures with explicit expected outcomes.
    isSatisfied: false
  - id: ac-04
    text: For C64 tape workloads, reproduce the exact native ordered CIA1 FLAG invocation, interrupt/timer state and clock observations at the approved observation boundary, with pinned main-CPU clock, alarm scheduled/dispatch clocks and callback offset. Do not interpret the former one-system-clock wording as permission for a one-cycle divergence. Include same-clock ordering and pending interrupt state, with missing, extra, duplicated and shifted events rejected. VIC-20 VIA2 CA1 parity remains separately mandatory under FR-RUNTIME-TAPE-002 and FR-TAP-003; CIA FLAG terminology does not substitute for it.
    isSatisfied: false
  - id: ac-05
    text: Half-wave and full-wave loader detection workloads both work correctly against pinned native VICE. Keep file/block TAP-v2 pairing (including each truncated half) distinct from live playback, which follows selected-machine tape behavior rather than applying a universal two-to-one conversion. Preserve fixture-specific ordered pulses, direction/phase, timer and load outcomes under separately pinned media version/system/video tags and machine resources.
    isSatisfied: false
  - id: ac-06
    text: Multi-speed loaders that change pulse rates mid-load are supported. Use a single pinned workload with an explicit sequence of rate transitions and assert the whole load result plus ordered native-equivalent pulse, timer and interrupt observations across every transition; disconnected constant-speed subtests do not prove the mid-load behavior. Run each required PAL/NTSC profile with pinned headers and preserve native scaling or lack of scaling.
    isSatisfied: false
  description: |-
    Many commercial C64 programs used turbo tape loaders that employ faster pulse encoding than the standard Commodore format. The emulator shall support turbo loaders by providing accurate tape read timing down to individual clock cycles.

    ## Acceptance Criteria
    - Turbo loaders using shorter pulses than the standard Commodore format, including the existing approximately-160-cycle workload obligation, function correctly with the same pinned C64 firmware, tape fixture, resources and initial state as native VICE. Do not impose 160 cycles as a parser minimum or normalize pulse widths to hardware estimates; cover representable values below, at and above 160 with separately asserted block-decoder units and native live scheduling/interrupt traces.
    - Common turbo formats (Novaload, Biturbo, Turbotape, Cyberload, Pavloda) load successfully. For each named C64 format, retain identified fixture and firmware hashes, resources, initial state, load entry/operation sequence, expected loaded bytes and machine-visible completion/failure observations. Native and managed results must both satisfy successful loading and match; two equal failures do not satisfy this criterion. A missing fixture, oracle capability or completion observation leaves the corresponding format unsatisfied, not waived.
    - Custom pulse encoding schemes are supported through accurate pulse-level emulation. Pin custom-stream bytes and their format-specific expected loading/output behavior independently of the managed implementation; compare ordered native and managed tape/interrupt/timer observations without converting the input into a recognized standard loader or normalizing its pulse widths. Include malformed/truncated and boundary fixtures with explicit expected outcomes.
    - For C64 tape workloads, reproduce the exact native ordered CIA1 FLAG invocation, interrupt/timer state and clock observations at the approved observation boundary, with pinned main-CPU clock, alarm scheduled/dispatch clocks and callback offset. Do not interpret the former one-system-clock wording as permission for a one-cycle divergence. Include same-clock ordering and pending interrupt state, with missing, extra, duplicated and shifted events rejected. VIC-20 VIA2 CA1 parity remains separately mandatory under FR-RUNTIME-TAPE-002 and FR-TAP-003; CIA FLAG terminology does not substitute for it.
    - Half-wave and full-wave loader detection workloads both work correctly against pinned native VICE. Keep file/block TAP-v2 pairing (including each truncated half) distinct from live playback, which follows selected-machine tape behavior rather than applying a universal two-to-one conversion. Preserve fixture-specific ordered pulses, direction/phase, timer and load outcomes under separately pinned media version/system/video tags and machine resources.
    - Multi-speed loaders that change pulse rates mid-load are supported. Use a single pinned workload with an explicit sequence of rate transitions and assert the whole load result plus ordered native-equivalent pulse, timer and interrupt observations across every transition; disconnected constant-speed subtests do not prove the mid-load behavior. Run each required PAL/NTSC profile with pinned headers and preserve native scaling or lack of scaling.
- kind: test
  id: TEST-CPU-001
  acceptanceCriteria:
  - id: ac-01
    text: These added criteria cover only FR-CPU-004/ac-03, ac-05 and ac-06. Other obligations under this TEST condition, including FR-CPU-001, FR-CPU-002, FR-CPU-003 and FR-CPU-005, are not covered by these criteria and remain unsatisfied until their own required evidence is accepted. Validate assertions first against independent correct mocks and deliberately corrupt mock responses rejected inside a green harness; then bind the same inputs, expected results and assertions to real managed and immutable native providers. Unknown native observations block real acceptance. Retain input, seed/history, source/binary/ROM/resource hashes and full receipts. For FR-CPU-004/ac-03, C64_PortMotorAndWrite_DdrTruthTable covers all DATA/DDR combinations for bits 5 and 3, changes caused by DATA and DDR, input/output transitions and repeated identical writes. Assert motor = !(DDR & DATA & 0x20), write = (~DDR | DATA) & 0x08, exact changed-effective-output calls and no call when the native effective output is unchanged. Reject swapped bits, wrong polarity, forwarding on every write, and missed DDR-only changes. Preserve unrelated bits and pin prior native output-history state.
    isSatisfied: false
  - id: ac-02
    text: These added criteria cover only FR-CPU-004/ac-03, ac-05 and ac-06. Other obligations under this TEST condition, including FR-CPU-001, FR-CPU-002, FR-CPU-003 and FR-CPU-005, are not covered by these criteria and remain unsatisfied until their own required evidence is accepted. Validate assertions first against independent correct mocks and deliberately corrupt mock responses rejected inside a green harness; then bind the same inputs, expected results and assertions to real managed and immutable native providers. Unknown native observations block real acceptance. Retain input, seed/history, source/binary/ROM/resource hashes and full receipts. For FR-CPU-004/ac-05, C64_PortBit5_ReadDirectionMatrix enumerates DATA bit5 low/high crossed with DDR input/output, both transitions and repeated reads. Assert input reads clear bit5 and output reads match pinned c64pla port calculation, preserving all unrelated read bits. Reject input pull-up, output forced-zero, SX capacitor substitution on C64, stale direction and unintended read-side output changes.
    isSatisfied: false
  - id: ac-03
    text: 'These added criteria cover only FR-CPU-004/ac-03, ac-05 and ac-06. Other obligations under this TEST condition, including FR-CPU-001, FR-CPU-002, FR-CPU-003 and FR-CPU-005, are not covered by these criteria and remain unsatisfied until their own required evidence is accepted. Validate assertions first against independent correct mocks and deliberately corrupt mock responses rejected inside a green harness; then bind the same inputs, expected results and assertions to real managed and immutable native providers. Unknown native observations block real acceptance. Retain input, seed/history, source/binary/ROM/resource hashes and full receipts. For FR-CPU-004/ac-06, C64_Capacitor_DeadlineInclusiveJitter: for clock 10, bits 6/7 use deadline 350010 with draw 0 and 420010 with draw 70000. SX bits 3/4/5 use 1500010 with draw 0 and 1800010 with draw 300000. Include interior draws and each bit separately. Reject microsecond conversion, an exclusive upper bound, wrong base, or one shared deadline for unequal draws. Endpoint fixtures use independent mocked draws; native cases must record an actual seeded/prelude-derived draw, not assert that a selected seed reaches an endpoint without evidence.'
    isSatisfied: false
  - id: ac-04
    text: "These added criteria cover only FR-CPU-004/ac-03, ac-05 and ac-06. Other obligations under this TEST condition, including FR-CPU-001, FR-CPU-002, FR-CPU-003 and FR-CPU-005, are not covered by these criteria and remain unsatisfied until their own required evidence is accepted. Validate assertions first against independent correct mocks and deliberately corrupt mock responses rejected inside a green harness; then bind the same inputs, expected results and assertions to real managed and immutable native providers. Unknown native observations block real acceptance. Retain input, seed/history, source/binary/ROM/resource hashes and full receipts. For FR-CPU-004/ac-06, C64_Capacitor_DdrTransitionMatrix: cover 0->0, 0->1, 1->0 and 1->1 for each eligible pin and data 0/1. Only 1->0 captures old data and consumes a random draw. Preserve an already-held charge/deadline through the other transitions, subject to a subsequent DATA read's expiration. Reject capture from data_read instead of data, reseeding on every DDR write, or forgetting zero-valued captures."
    isSatisfied: false
  - id: ac-05
    text: 'These added criteria cover only FR-CPU-004/ac-03, ac-05 and ac-06. Other obligations under this TEST condition, including FR-CPU-001, FR-CPU-002, FR-CPU-003 and FR-CPU-005, are not covered by these criteria and remain unsatisfied until their own required evidence is accepted. Validate assertions first against independent correct mocks and deliberately corrupt mock responses rejected inside a green harness; then bind the same inputs, expected results and assertions to real managed and immutable native providers. Unknown native observations block real acceptance. Retain input, seed/history, source/binary/ROM/resource hashes and full receipts. For FR-CPU-004/ac-06, C64_Capacitor_RepeatedDataWrite: write high twice while output at distinct clocks, write low, then write the same low again. Each write consumes its eligible draws and moves deadlines even without a data-value change. Repeat while input: no capacitor update or draw. Reject same-value suppression, zero-value suppression, or charging an input pin.'
    isSatisfied: false
  - id: ac-06
    text: 'These added criteria cover only FR-CPU-004/ac-03, ac-05 and ac-06. Other obligations under this TEST condition, including FR-CPU-001, FR-CPU-002, FR-CPU-003 and FR-CPU-005, are not covered by these criteria and remain unsatisfied until their own required evidence is accepted. Validate assertions first against independent correct mocks and deliberately corrupt mock responses rejected inside a green harness; then bind the same inputs, expected results and assertions to real managed and immutable native providers. Unknown native observations block real acceptance. Retain input, seed/history, source/binary/ROM/resource hashes and full receipts. For FR-CPU-004/ac-06, C64_Capacitor_ReadBoundaryAndLazyExpiry: independent fixtures at D-1, D and D+1 show retained, retained and cleared charge. Also perform repeated reads; DDR-only reads after D; no-read gaps followed by a DATA read; and DATA reads while output. Output reads still execute expiry but do not overlay charge. Reject `<=`, host-time expiry, DDR-read discharge, output overlay, or a synthetic read inserted into the prelude.'
    isSatisfied: false
  - id: ac-07
    text: 'These added criteria cover only FR-CPU-004/ac-03, ac-05 and ac-06. Other obligations under this TEST condition, including FR-CPU-001, FR-CPU-002, FR-CPU-003 and FR-CPU-005, are not covered by these criteria and remain unsatisfied until their own required evidence is accepted. Validate assertions first against independent correct mocks and deliberately corrupt mock responses rejected inside a green harness; then bind the same inputs, expected results and assertions to real managed and immutable native providers. Unknown native observations block real acceptance. Retain input, seed/history, source/binary/ROM/resource hashes and full receipts. For FR-CPU-004/ac-06, C64_Capacitor_BoardPinMatrix: normal C64 bits 6/7 and SX-64 bits 3..7 use the appropriate paths. Ordinary C64 bits 3/4/5 keep their native tape/pull-up behavior, not SX capacitor substitution. Include mixed eligible/ineligible DDR masks and preserved unrelated return bits. Reject applying SX behavior to C64 or treating all SX inputs as zero.'
    isSatisfied: false
  - id: ac-08
    text: 'These added criteria cover only FR-CPU-004/ac-03, ac-05 and ac-06. Other obligations under this TEST condition, including FR-CPU-001, FR-CPU-002, FR-CPU-003 and FR-CPU-005, are not covered by these criteria and remain unsatisfied until their own required evidence is accepted. Validate assertions first against independent correct mocks and deliberately corrupt mock responses rejected inside a green harness; then bind the same inputs, expected results and assertions to real managed and immutable native providers. Unknown native observations block real acceptance. Retain input, seed/history, source/binary/ROM/resource hashes and full receipts. For FR-CPU-004/ac-06, C64_Capacitor_RngConsumptionOrder: with scripted distinct draws 1,2,3,4,5 and all eligible pins, SX DDR transitions consume in order 3,4,5,6,7; SX DATA writes consume 7,6,5,4,3. C64 DDR uses 6,7 and DATA uses 7,6. Test sparse masks and earlier global draws. Reject sorting both paths alike, drawing for an ineligible pin, restarting the RNG per pin, or sharing one draw across pins.'
    isSatisfied: false
  - id: ac-09
    text: 'These added criteria cover only FR-CPU-004/ac-03, ac-05 and ac-06. Other obligations under this TEST condition, including FR-CPU-001, FR-CPU-002, FR-CPU-003 and FR-CPU-005, are not covered by these criteria and remain unsatisfied until their own required evidence is accepted. Validate assertions first against independent correct mocks and deliberately corrupt mock responses rejected inside a green harness; then bind the same inputs, expected results and assertions to real managed and immutable native providers. Unknown native observations block real acceptance. Retain input, seed/history, source/binary/ROM/resource hashes and full receipts. For FR-CPU-004/ac-06, C64_Capacitor_ResetAndClockWrap: reset after charge must clear charges/flags and leave the observed deadline fields as native does. A later input read must not resurrect charge. With clock `UINT64_MAX-10`, base350000 and draw0, deadline wraps to349989; an immediate DATA read at that high clock sees deadline<clock and expires. Reject saturating/signed arithmetic, invented wrap-aware expiration, or preserving active flags on reset. Full native reset/prelude effects remain part of the fixture, not inferred from this function alone.'
    isSatisfied: false
  - id: ac-10
    text: 'These added criteria cover only FR-CPU-004/ac-03, ac-05 and ac-06. Other obligations under this TEST condition, including FR-CPU-001, FR-CPU-002, FR-CPU-003 and FR-CPU-005, are not covered by these criteria and remain unsatisfied until their own required evidence is accepted. Validate assertions first against independent correct mocks and deliberately corrupt mock responses rejected inside a green harness; then bind the same inputs, expected results and assertions to real managed and immutable native providers. Unknown native observations block real acceptance. Retain input, seed/history, source/binary/ROM/resource hashes and full receipts. For FR-CPU-004/ac-06, C64_Capacitor_PalNtscAndConfiguredModel: repeat board/pin cases for accepted PAL/NTSC and configured C64/SX model variants. Constants remain in CPU-cycle units; wall-clock duration can differ with clock rate. In these pinned paths a configured 8500 model does not select the unused 8500 constant. Reject host-frequency scaling of deadlines, a hardware-intent replacement, or omission of a required board/model/resource combination. Pin the actually supported model/resource values before building executable fixtures.'
    isSatisfied: false
