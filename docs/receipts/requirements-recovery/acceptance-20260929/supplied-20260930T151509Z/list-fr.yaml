        isSatisfied: false
      - id: ac-02
        text: NMI is edge-detected (falling edge); once detected, it is serviced after the current instruction regardless of the I flag.
        isSatisfied: false
      - id: ac-03
        text: The BRK instruction pushes PC+2 (not PC+1) and sets the B flag in the pushed status register.
        isSatisfied: false
      - id: ac-04
