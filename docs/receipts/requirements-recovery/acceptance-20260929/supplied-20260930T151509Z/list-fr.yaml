        isSatisfied: false
      - id: ac-03
        text: Lifecycle state is reported as idle, running, paused, faulted, or stopped.
        isSatisfied: false
      - id: ac-04
        text: Lifecycle commands are serialized per session so transitions cannot race.
        isSatisfied: false
      - id: ac-05
