        text: During a badline, the VIC-II performs 40 c-accesses to read the screen matrix.
        isSatisfied: false
      - id: ac-03
        text: The CPU is halted for 40-43 cycles during a badline (3 setup cycles + 40 character fetch cycles).
        isSatisfied: false
